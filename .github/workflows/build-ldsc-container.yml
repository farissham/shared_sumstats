name: Build ldsc container

on:
  push:
    branches: [main, feat/**]
    paths:
      - 'docker/ldsc/Dockerfile'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE:    ghcr.io/${{ github.repository_owner }}/ldsc

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: docker/ldsc
          push: true
          tags: |
            ${{ env.IMAGE }}:1.0.1
            ${{ env.IMAGE }}:latest
